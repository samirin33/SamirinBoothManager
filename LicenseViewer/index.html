<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ライセンス一覧 | samirin33's Booth</title>
    <meta
      name="description"
      content="SamirinBoothInformation のライセンスファイルを表示します。"
    />
    <meta name="theme-color" content="#1B6B4A" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="md-top-app-bar" role="banner">
      <div class="md-top-app-bar__inner">
        <div class="md-top-app-bar__leading">
          <span class="md-top-app-bar__mark" aria-hidden="true">
            <svg class="md-top-app-bar__icon" viewBox="0 0 24 24" focusable="false">
              <path
                fill="currentColor"
                d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm4 18H6V4h7v5h5v11zM8 13h8v2H8v-2zm0 4h5v2H8v-2zm0-8h3v2H8V9z"
              />
            </svg>
          </span>
          <div class="md-top-app-bar__titles">
            <div class="md-top-app-bar__title">samirin33's Booth</div>
            <div class="md-top-app-bar__subtitle">商品ライセンス一覧</div>
          </div>
        </div>
        <nav class="md-top-app-bar__actions" aria-label="関連リンク">
          <a class="md-btn md-btn--text" href="./">一覧</a>
          <a
            class="md-btn md-btn--tonal"
            href="https://www.vn3.org/"
            target="_blank"
            rel="noopener noreferrer"
          >VN3公式</a>
        </nav>
      </div>
    </header>

    <div class="md-shell">
      <div class="md-meta-row">
        <nav class="md-breadcrumb" id="breadcrumb" aria-label="パンくず"></nav>
        <div id="load-status" class="md-status-line" role="status" aria-live="polite"></div>
      </div>

      <main class="md-surface-card" id="main">
        <div id="app">
          <div class="md-empty">
            <p class="md-label-md">Loading</p>
            <h1 class="md-headline-sm">読み込み中…</h1>
          </div>
        </div>
      </main>

      <footer class="md-footer">
        <div id="last-updated" class="md-footer__updated">最終更新日: —</div>
      </footer>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/parser.js"></script>
    <script src="./js/renderer.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
