<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ライセンス一覧 | Samirin Booth</title>
    <meta
      name="description"
      content="SamirinBoothInformation のライセンスファイルを VN3 公開書式に近いレイアウトで表示します。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-name">Samirin Booth</div>
          <div class="brand-sub">License Viewer</div>
        </div>
        <nav class="top-links" aria-label="関連リンク">
          <a href="./">一覧</a>
          <a href="https://www.vn3.org/" target="_blank" rel="noopener noreferrer">VN3公式</a>
        </nav>
      </header>

      <div class="breadcrumb" id="breadcrumb" aria-label="パンくず"></div>
      <div id="load-status" role="status" aria-live="polite"></div>

      <main class="paper">
        <div id="app">
          <div class="empty-state">
            <p class="eyebrow">Loading</p>
            <h1>読み込み中…</h1>
          </div>
        </div>
      </main>

      <footer class="site-footer">
        表示内容は SamirinBoothInformation 配下のライセンステキストを自動取得したものです。
        法的効力は各製品に同梱された利用規約本文が優先されます。
      </footer>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/parser.js"></script>
    <script src="./js/renderer.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
